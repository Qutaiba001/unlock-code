<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كود فتح المشاهدة - House of the Dragon</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .box {
            background: #161616;
            padding: 30px 20px;
            border-radius: 16px;
            max-width: 400px;
            margin: 50px auto;
            box-shadow: 0 4px 25px rgba(0,0,0,0.7);
            border: 1px solid #222;
        }
        .code {
            font-size: 36px;
            font-weight: bold;
            color: #46D369;
            background: #0f0f0f;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            letter-spacing: 6px;
            border: 1px solid #2a2a2a;
        }
        .timer {
            color: #888;
            font-size: 13px;
            margin-top: 10px;
        }
        .error {
            color: #ff5555;
            font-size: 14px;
            line-height: 1.6;
        }
        h2 {
            color: #fff;
            font-size: 20px;
            margin-bottom: 10px;
        }
        p {
            color: #bbb;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="box" id="contentBox">
        <h2>جاري التحقق من الرابط...</h2>
    </div>

    <script>
        const SECRET_TOKEN = "hotd2026"; 

        const urlParams = new URLSearchParams(window.location.search);
        const userToken = urlParams.get('token');

        const box = document.getElementById('contentBox');

        // التحقق إما بوجود التتوكن في الرابط أو مخزن مؤقتاً في جلسة المتصفح المفتوحة حالياً
        let hasAccess = false;

        if (userToken === SECRET_TOKEN) {
            hasAccess = true;
            // تخزين حالة السماح مؤقتاً طالما التبويب مفتوح فقط
            sessionStorage.setItem('hotd_allowed', 'true');
            // تنظيف شريط العنوان فوراً لمنع حفظ الرابط بالتوكن في المفضلة
            window.history.replaceState({}, document.title, window.location.pathname);
        } else if (sessionStorage.getItem('hotd_allowed') === 'true') {
            hasAccess = true;
        }

        if (hasAccess) {
            const CODE_SLOT_MS = 30 * 60 * 1000;

            function generateCode() {
                const currentTime = Date.now();
                const slot = Math.floor(currentTime / CODE_SLOT_MS);
                
                const code = ((slot * 7919 + 123457) % 900000) + 100000;
                
                box.innerHTML = `
                    <h2>رمز التفعيل الخاص بك</h2>
                    <p>انسخ هذا الكود وضعه في التطبيق لفتح المشاهدة:</p>
                    <div class="code">${Math.floor(code)}</div>
                    <div class="timer">⏳ يتغير الكود تلقائياً كل 30 دقيقة</div>
                `;
            }

            generateCode();
            setInterval(generateCode, 1000);

        } else {
            box.innerHTML = `
                <h2>عذراً، الوصول غير مسموح</h2>
                <p class="error">لا يمكنك الحصول على الكود مباشرة.<br>يجب عليك إكمال الخطوات عبر الرابط المختصر المخصص للحصول على الكود.</p>
            `;
        }
    </script>

</body>
  </html>
